<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class=" bg-black text-light d-flex align-items-center justify-content-center mi-vh-100 p-3">
    <!--Tarjeta pincipal card-->
    <div class="card bg-dark text-light border-secondary shadow-lg col-12 col-sm-10 col-md-6 col-lg-4">
      <!--Encabezado con el nombre del estudiante-->
      <div class="card-header border-secondary text-center py-3 ">
        <span class="badge bg-info text dark text-uppercase fw-bold mb-1 ">
            BTH Sistemas Infpormaticos 5to Sec
        </span>
        <h2 id="nombreEstudiante" class="h4 fw-bold text-white mb-0">Alan Brito Delgado</h2>
      </div>
      <!--Cuerpo de la ficha--> 
      <div class="card-body p-4">
        <!--Indicador del promedio anual-->
        <div class="alert bg-black border border-secondary text-center mb-4">
            <p id="notaPromedio" class="fs-4 fw-bold mb-0 text-light ">Promedio Anual: 0.0 Pts</p>
        </div>
        <!--Nota primer Trimestre-->
        <div class="mb-3">
            <label for="notaTrimestre1" class="form-label fw-semibold text-secondary">Nota 1er Trimestre (0 - 100)</label>
            <input type="number" id="notaTrimestre1" placeholder="Ej. 69" min="10" max="100" class="form-control bg-black text-light border-secondary">
        </div>
        
        <!--Nota segundo Trimestre-->
        <div class="mb-3">
            <label for="notaTrimestre2 " class="form-label fw-semibold text-secondary">Nota 2do Trimestre (0 - 100)</label>
            <input type="number" id="notaTrimestre2" placeholder="Ej. 69" min="10" max="100 " class="form-control bg-black text-light border-secondary">
        </div>
        
        <!--Nota tercer Trimestre-->
        <div class="mb-3">
            <label for="notaTrimestre3" class="form-label fw-semibold text-secondary">Nota 3er Trimestre (0 - 100)</label>
            <input type="number" id="notaTrimestre3" placeholder="Ej. 69" min="10" max="100" class="form-control bg-black text-light border-secondary">
        </div>
        <!--Botòn de acciòn-->
        <button id="btnCalcular" type="button" class="btn btn-success w-100 fw-bold py-2 text-uppercase ">Calcular Nota final</button>
      </div> 
      <!--Pie de tarjeta--> 
      <div class="card-footer border-secondary text-center text-secondary small">
        Nota minima de aprobacion: 51.0 Pts
      </div>   
    </div>
    <script src="script.js"></script>    
</body>
</html>
